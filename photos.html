  <!-- Popup that opens when you click a photo -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-box">
      <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <p id="lightbox-date" class="lightbox-date"></p>
    </div>
  </div>

  <script>
    var box = document.getElementById('lightbox');
    var img = document.getElementById('lightbox-img');
    var cap = document.getElementById('lightbox-caption');
    var date = document.getElementById('lightbox-date');

    document.querySelectorAll('.photo').forEach(function (p) {
      p.addEventListener('click', function (e) {
        e.preventDefault();
        img.src = p.getAttribute('href');
        img.alt = p.querySelector('img').alt;
        cap.textContent = p.dataset.caption || '';
        date.textContent = p.dataset.date || '';
        box.hidden = false;
      });
    });

    function closeBox() { box.hidden = true; img.src = ''; }
    document.getElementById('lightbox-close').addEventListener('click', closeBox);
    box.addEventListener('click', function (e) { if (e.target === box) closeBox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBox(); });
  </script>
